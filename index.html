<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regular Expression Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Regex Sandbox</h1>

    <header>
        <h3>Regex Pattern:</h3>
        <div id="input-container">
            /
            <input type="text" placeholder="Enter your regex pattern">/
        </div>
        
        <label for="flags">Flags:</label> <input type="checkbox" name="i" id="flag i"> i 
        <input type="checkbox" name="g" id="flag g">g
    </header>

    <section>
        <h3>Test String:</h3>
        <input type="text" placeholder="Enter your test string">
    </section>

    <button id="test-btn">Test Regex</button>

    <label for="result"> Result</label> 
    <div><p id="result">Sample</p></div>
</body>
</html>
